spring:
  application:
    name: chinguDachi

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        show_sql: true
    open-in-view: false
  servlet:
    multipart:
      enabled: true
      max-file-size: 5MB
      max-request-size: 6MB
  docker:
    compose:
      lifecycle-management: start-and-stop

upload:
  profile-image:
    directory: uploads/profile-images
    base-url: http://localhost:8080/uploads/profile-images

cors:
  allowed-origins:
    - "http://localhost:3000"

jwt:
  secret: "Y2hpbmd1ZGFjaGktand0LXNlY3JldC1rZXktZm9yLWxvY2FsLWRldi0yNTZiaXQ"
  access-token-expiry: 1h
  refresh-token-expiry: 30d

oauth:
  google:
    client-id: ${GOOGLE_CLIENT_ID:your-client-id}
    client-secret: ${GOOGLE_CLIENT_SECRET:your-client-secret}
    redirect-uri: "http://localhost:3000/auth/callback"
    allowed-redirect-uris:
      - "https://auth.expo.io/@won123457/chingu-dachi"

openai:
  api-key: ${OPENAI_API_KEY:sk-placeholder}
  api-url: https://api.openai.com/v1/chat/completions
  model: gpt-4.1-mini
