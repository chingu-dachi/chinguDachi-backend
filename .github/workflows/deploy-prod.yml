name: Deploy Backend (Prod)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to deploy (e.g. v1.0.0)'
        required: true
        type: string

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Prod EC2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.PROD_EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: DB_PASSWORD,JWT_SECRET,GOOGLE_CLIENT_ID,GOOGLE_CLIENT_SECRET,OPENAI_API_KEY
          script: |
            cd /app/chingudachi-backend
            git fetch --tags
            git checkout ${{ github.event.inputs.tag }}

            # Generate .env.prod from GitHub Secrets
            cat > .env.prod << EOF
            SPRING_PROFILES_ACTIVE=prod
            DB_PASSWORD=${DB_PASSWORD}
            JWT_SECRET=${JWT_SECRET}
            GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
            GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
            GOOGLE_REDIRECT_URI=https://app.chingu-dachi.com/auth/callback
            OPENAI_API_KEY=${OPENAI_API_KEY}
            CORS_ALLOWED_ORIGINS=https://app.chingu-dachi.com,https://chingu-dachi.com
            DOMAIN=api.chingu-dachi.com
            EOF

            # Generate nginx conf from template
            sed "s|DOMAIN_PLACEHOLDER|chingu-dachi.com|g" \
              nginx/conf.d/default.conf.template \
              > nginx/conf.d/default.conf

            docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build
            sleep 30
            curl -f http://localhost:8080/actuator/health || exit 1
            echo "Prod deployment successful! Tag: ${{ github.event.inputs.tag }}"
        env:
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
