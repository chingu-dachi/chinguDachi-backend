name: Deploy Backend (Dev)

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'Dockerfile'
      - 'docker-compose.prod.yml'
      - 'nginx/**'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Dev EC2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEV_EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /app/chingudachi-backend
            git pull origin main
            # Generate nginx conf from template
            if [ -f nginx/conf.d/default.conf.template ]; then
              DOMAIN=$(grep '^DOMAIN=' .env.dev | cut -d'=' -f2)
              sed "s|DOMAIN_PLACEHOLDER|${DOMAIN}|g" \
                nginx/conf.d/default.conf.template \
                > nginx/conf.d/default.conf
            fi
            docker compose -f docker-compose.prod.yml --env-file .env.dev up -d --build
            sleep 30
            curl -f http://localhost:8080/actuator/health || exit 1
            echo "Dev deployment successful!"
